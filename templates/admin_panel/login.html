<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    {% include 'admin_panel/_head.html' %}
    <title>Admin Login | MiniShop</title>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="sidebar-logo justify-content-center mb-2">
            <i class="bi bi-bag-fill"></i>
            <span>Mini<b>Shop</b> <small>Admin</small></span>
        </div>
        <p class="text-center text-secondary mb-4">Sign in to manage your store</p>

        {% include '_messages.html' %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
        </form>
        <a href="{% url 'home' %}" class="d-block text-center mt-4 small">&larr; Back to website</a>
    </div>
</body>
</html>
